<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://res.cloudinary.com/dbfalryaz/image/upload/c_crop,g_auto,w_1100,h_1100/c_scale,w_32,h_32/v1774883515/logo-tomodoaventureiro_iy0xh8.png" />
  <link rel="icon" type="image/png" sizes="192x192"
    href="https://res.cloudinary.com/dbfalryaz/image/upload/c_crop,g_auto,w_1100,h_1100/c_scale,w_192,h_192/v1774883515/logo-tomodoaventureiro_iy0xh8.png" />
  <link rel="apple-touch-icon" sizes="180x180"
    href="https://res.cloudinary.com/dbfalryaz/image/upload/c_crop,g_auto,w_1100,h_1100/c_scale,w_180,h_180/v1774883515/logo-tomodoaventureiro_iy0xh8.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomo do Aventureiro</title>
  <script>
    // Anti-flash: aplica tema + cor de marca + tipografia antes do primeiro
    // paint. Espelha src/utils/appearance.ts (applyAppearance) — manter em sincronia.
    try {
      var r = document.documentElement;
      var t = localStorage.getItem('tomo:theme');
      if (t !== 'light' && t !== 'dark' && t !== 'parchment') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      r.setAttribute('data-theme', t);

      var b = localStorage.getItem('tomo:brand-color');
      if (b) {
        r.style.setProperty('--brand', b);
        r.style.setProperty('--chip-violet-text', b);
        r.style.setProperty('--chip-violet-bg', 'color-mix(in oklab, ' + b + ' 16%, transparent)');
        r.style.setProperty('--chip-violet-bg-hover', 'color-mix(in oklab, ' + b + ' 26%, transparent)');
        r.style.setProperty('--chip-violet-border', 'color-mix(in oklab, ' + b + ' 42%, transparent)');
      }
      if (localStorage.getItem('tomo:font') === 'modern') {
        var sans = "'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
        r.style.setProperty('--font-display', sans);
        r.style.setProperty('--font-body', sans);
      }
    } catch (e) { /* localStorage/matchMedia indisponivel */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
