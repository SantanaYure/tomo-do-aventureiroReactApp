name: Deploy Staging

# Homologação. Push/merge em `develop` -> CI -> deploy na Vercel (target preview)
# -> alias fixo de staging -> smoke test.
#
# DORMENTE por padrão (job `guard`): só roda o deploy se o secret VERCEL_TOKEN
# existir. O job `ci` roda sempre. Requer que a branch `develop` exista.
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Dormente até o secret VERCEL_TOKEN existir (ver deploy-production.yml).
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy + smoke (staging)
    needs: [guard, ci]
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_ALIAS || 'tomo-do-aventureiro-react-app-staging.vercel.app' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: ${{ vars.STAGING_ALIAS || 'tomo-do-aventureiro-react-app-staging.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vercel pull (env de preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Apontar o alias de staging
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGING_ALIAS" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test de staging
        run: node scripts/smoke-test.mjs "https://$STAGING_ALIAS"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy de staging"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployment | ${{ steps.deploy.outputs.url }} |"
            echo "| Staging | https://$STAGING_ALIAS |"
          } >> "$GITHUB_STEP_SUMMARY"
